name: CI

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  schedule:
    # 每天一次：即使**没有人碰这个仓**，BOM 陈旧也要被看见。
    #
    # 为什么需要 schedule：上面两个触发器都要求「本仓被改动」，而 BOM 陈旧恰恰
    # 发生在**别的仓发了版、本仓没跟着重生成**的时候 ⇒ 只靠 push/PR 触发 ⇒
    # 陈旧能潜伏到下一次有人碰本仓为止。矩阵审计的周报能发现它，但那是**开 issue
    # 给人看**，不是 CI 自己红（oekit/oekit#98 就是这么被人翻出来的）。
    #
    # 错峰到 03:17：整点是 GitHub Actions 的排队高峰（所有定时任务挤在 :00）。
    - cron: '17 3 * * *'

permissions:
  contents: read

jobs:
  # 伞仓（BOM）**故意不用**共享的 oekit/.github go-ci.yml：那个 workflow 带
  # 「Check go mod tidy」门禁，而本仓的 require 是**无 import 的地板**
  # （36 个发版单元的兼容版本快照），tidy 会把它们全部清掉。
  # 本 workflow 因此只做三件本仓真正需要的事：
  #   ① 生成的 matrix.go 能编译（它是机读版本快照，坏了消费方就读不到版本）；
  #   ② 35 个地板**真的存在于 proxy 且校验和完整**（tag 被删/被重打会红）；
  #   ③ go.mod 不会被任何工具悄悄改掉（tidy 清空地板的护栏）。
  bom:
    name: BOM build & floors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
      - name: Build & vet
        run: |
          GOWORK=off go build ./...
          GOWORK=off go vet ./...
      - name: 35 个地板全部可取 + 校验和完整
        # go mod download 只拉本仓 require 的 35 个 oekit 模块（伞仓不能 require
        # 自己）——它们各自的三方依赖被 Go 1.17+ 的模块图裁剪剪掉了（伞仓不
        # import 任何包），所以这一步既验证「地板都在」又不会把整个生态拖进 CI。
        #
        # 顺带守住 sum.golang.org：写 go.sum 新条目时要与 sumdb 对账，若某个 tag
        # 被重打（校验和与 sumdb 不一致）下载会直接失败——2026-10-19 的
        # v0.5.2 tag 校验和事故就是这一类，本步会让它变红而不是流到用户。
        run: |
          GOWORK=off go mod download
          GOWORK=off go mod verify
          # 模块图里的 oekit 模块 = 35 个地板 + 伞仓自身 = 36 个发版单元
          n=$(GOWORK=off go list -m all | grep -c '^github.com/oekit/' || true)
          echo "模块图里的 oekit 模块：$n"
          if [ "$n" -ne 36 ]; then
            echo "::error::模块图里应有 36 个 oekit 模块（35 个地板 + 伞仓自身 = 24 根 + 11 嵌套 + 1 伞仓），实际 $n"
            exit 1
          fi
      - name: go.mod 不得被改动
        # 护栏：本仓的 require 是无 import 的地板，任何 tidy/工具改写都会清空
        # 它们——正确做法是重跑 matrix-tools/scripts/gen_matrix_go.py。
        run: |
          if ! git diff --exit-code -- go.mod; then
            echo "::error::go.mod 被改动了——本仓的 require 是无 import 的地板，tidy 会清掉；正确做法是重跑 matrix-tools/scripts/gen_matrix_go.py"
            git diff -- go.mod
            exit 1
          fi
      - name: 地板数量护栏
        # 35 = 24 根 + 11 嵌套（伞仓不能 require 自己，故 36 个发版单元里
        # 伞仓自身不在 go.mod 里）。少一个说明生成器或登记表出问题了。
        run: |
          n=$(grep -cE '^\s+github\.com/oekit/' go.mod || true)
          echo "go.mod 里的 oekit 地板：$n"
          if [ "$n" -ne 35 ]; then
            echo "::error::地板数量应为 35（24 根 + 11 嵌套；伞仓自身不在自己的 require 里），实际 $n"
            exit 1
          fi

      # ---- BOM 新鲜度门禁（oekit/oekit#98）----
      #
      # 为什么要有这道门禁：BOM 是「一次拉齐一组兼容版本」的快照——
      # 快照里的地板一旦落后于各仓**远端最新 tag**，
      # `go get github.com/oekit/oekit@latest` 就会把下游拉到旧组合。
      # 而「BOM 陈旧」这件事此前只能靠人翻（矩阵审计的周报开 issue 才被看见，
      # #98 就是这么来的）⇒ 下次还会靠人翻。
      #
      # 判据复用矩阵侧已经在调的 `gen_matrix_go.py --check`（矩阵审计的 audit job 调它），
      # **不自写一套判据**：退出码契约由生产方定义——0=一致 / 1=真漂移 / 2=读不到
      # 远端 tag（判不了 ≠ 通过，矩阵-tools#79）。
      #
      # 为什么单独 checkout matrix-tools 到 **../matrix-tools**（而不是默认路径）：
      # ① 判据脚本住在治理仓（matrix-tools），本仓只有 BOM 产物；
      # ② 默认路径 = workspace = 本仓的检出 ⇒ 会把本仓的检出覆盖掉；
      # ③ BASE 口径要求「BASE/oekit = 本仓」，本仓必须在 BASE 之外。
      - uses: actions/checkout@v7
        with:
          repository: oekit/matrix-tools
          ref: main
          path: ../matrix-tools
      - name: 准备判据现场（克隆矩阵模块 + 把本仓接到 BASE/oekit）
        # 判据要读两样事实：
        #   ① 各仓**远端最新 tag**（走 HTTPS，不需要 clone）；
        #   ② 各仓在那个 tag 上的 **go 指令**（Go 地板 ⇒ 需要本地 clone 拿到 tag）。
        # ⇒ 这里把 24 个模块仓克隆到 BASE 下（清单来自 matrix.py，不是手写硬编码——
        # 旧硬编码含已删的仓，clone 404 会让 workflow 直接起不来）。
        run: |
          set -euo pipefail
          BASE="$RUNNER_TEMP/bom-base"
          mkdir -p "$BASE"
          MODS=$(cd ../matrix-tools && python3 -c "import matrix; print(' '.join(matrix.MODULES))")
          echo "克隆模块仓：$MODS"
          for m in $MODS; do
            git clone --quiet "https://github.com/oekit/$m.git" "$BASE/$m"
          done
          # BASE/oekit 指向**本仓的检出**（PR 上要判的是这次改动的产物，
          # 不是远端 main 的产物）⇒ 用符号链接，不重新 clone。
          ln -s "$GITHUB_WORKSPACE" "$BASE/oekit"
          echo "BASE=$BASE（BASE/oekit → 本仓检出）"
      - name: 判据自证——故意陈旧的 BOM 必须被判红（否则这道门禁没有牙齿）
        # 自证必须**先于**主判定跑：主判定红的时候，正是最需要自证的时候。
        # 若把自证放在判定之后，红了就永远执行不到 ⇒ 「自证全绿」只说明
        # 「绿的时候它会跑」（本轮 oekit/oekit#98 的门禁纪律）。
        #
        # 造一份**故意陈旧**的快照（把某个地板降到上一版）⇒ 判据必须判它红。
        # 判红的口径用**退出码**（1=真漂移），不看输出文本。
        run: |
          set -euo pipefail
          BASE="$RUNNER_TEMP/bom-base"
          PROOF="$RUNNER_TEMP/bom-proof"
          mkdir -p "$PROOF/oekit"
          cp "$GITHUB_WORKSPACE/go.mod" "$PROOF/oekit/go.mod"
          cp "$GITHUB_WORKSPACE/matrix.go" "$PROOF/oekit/matrix.go"
          python3 -c "
          import re,sys
          p=sys.argv[1]
          t=open(p,encoding='utf-8').read()
          m=re.search(r'(github[.]com/oekit/[a-z0-9-]+) v([0-9]+)[.]([0-9]+)[.]([0-9]+)',t)
          assert m,'go.mod 里找不到 oekit 地板行'
          mod,a,b,c=m.group(1),int(m.group(2)),int(m.group(3)),int(m.group(4))
          new='%s v%d.%d.%d'%(mod,a,b,max(c-1,0))
          open(p,'w',encoding='utf-8').write(t[:m.start()]+new+t[m.end():])
          print('自证用的陈旧快照地板：',new)
          " "$PROOF/oekit/go.mod"
          # 模块仓复用同一批克隆（符号链接，不重复克隆）
          for d in "$BASE"/*/; do
            m=$(basename "${d%/}")
            if [ "$m" = "oekit" ]; then continue; fi
            ln -s "${d%/}" "$PROOF/$m"
          done
          set +e
          MATRIX_BASE="$PROOF" python3 ../matrix-tools/scripts/gen_matrix_go.py --check
          rc=$?
          set -e
          if [ "$rc" -ne 1 ]; then
            echo "::error::判据自证失败：故意陈旧的 BOM 未被判红（期望退出码 1=真漂移，实际 $rc）——这道门禁没有牙齿，先修判据再谈门禁"
            exit 1
          fi
          echo "✓ 判据自证通过：故意陈旧的 BOM 被判红（退出码 1）"
      - name: BOM 新鲜度（快照 vs 各仓远端最新 tag）
        run: |
          set -uo pipefail
          MATRIX_BASE="$RUNNER_TEMP/bom-base" python3 ../matrix-tools/scripts/gen_matrix_go.py --check
          rc=$?
          if [ "$rc" -eq 2 ]; then
            echo "::error::读不到远端 tag ⇒ 无法核对 BOM 新鲜度（判不了 ≠ 通过）——先修好网络/凭证再重试"
            exit 1
          fi
          if [ "$rc" -ne 0 ]; then
            echo "::error::BOM 快照与各仓远端最新 tag 不一致（陈旧）——正确做法是重跑 matrix-tools/scripts/gen_matrix_go.py --version vX.Y.Z 重生成，随本仓发版"
            exit 1
          fi
          echo "✓ BOM 快照与各仓远端最新 tag 一致"
